name: FTP maintenance (one-off file removal)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ftp-maintenance.yml'
  workflow_dispatch:

jobs:
  remove-files:
    runs-on: ubuntu-latest
    steps:
      - name: Delete files from site root over FTPS
        env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for f in google95fa4c1e67d19ede.html; do
            curl --ssl-reqd --silent --show-error --max-time 60 --user "$U:$P" "ftp://$H/" -Q "DELE $f" -o /dev/null && echo "deleted $f" || echo "could not delete $f"
          done
