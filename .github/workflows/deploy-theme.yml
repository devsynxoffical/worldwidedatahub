name: Deploy theme to hosting

on:
  push:
    branches: [main]
    paths:
      - 'worldwidedatahub.com/wp-content/themes/theglobaldatabase/**'
      - '.github/workflows/deploy-theme.yml'
  workflow_dispatch:

concurrency:
  group: deploy-theme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout theme only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            worldwidedatahub.com/wp-content/themes/theglobaldatabase
          sparse-checkout-cone-mode: true

      - name: Check FTP server reachability
        env:
          H: ${{ secrets.FTP_SERVER }}
        run: |
          echo "Resolving FTP host..."; getent hosts "$H" || echo "DNS lookup FAILED"
          for h in "$H" worldwidedatahub.com ftp.worldwidedatahub.com; do
            timeout 10 bash -c "echo > /dev/tcp/$h/21" && echo "port 21 OPEN on $h" || echo "port 21 CLOSED/TIMEOUT on $h"
          done
          getent hosts worldwidedatahub.com ftp.worldwidedatahub.com || true

      - name: Upload changed theme files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./worldwidedatahub.com/wp-content/themes/theglobaldatabase/
          server-dir: ./wp-content/themes/theglobaldatabase/
          timeout: 120000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            php_errorlog
            **/*.log
